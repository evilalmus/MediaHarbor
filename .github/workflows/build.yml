name: Generate and Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Android Project via Python
        run: |
          python3 - << 'EOF'
          import os
          import textwrap

          FILES = {
              "settings.gradle.kts": r"""pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
                  maven { url = uri("https://chaquo.com/maven") }
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://chaquo.com/maven") }
              }
          }
          rootProject.name = "OmniGrab"
          include(":app")
          """,

              "build.gradle.kts": r"""plugins {
              id("com.android.application") version "8.3.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
              id("com.chaquo.python") version "15.0.1" apply false
          }
          """,

              "gradle.properties": r"""org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          """,

              "app/build.gradle.kts": r"""plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("com.chaquo.python")
          }

          android {
              namespace = "com.local.omnigrab"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.local.omnigrab"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 3
                  versionName = "1.3"

                  ndk {
                      abiFilters += listOf("arm64-v8a", "x86_64")
                  }
              }

              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.10"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          chaquopy {
              defaultConfig {
                  version = "3.11"
                  pip {
                      install("yt-dlp")
                      install("gallery-dl")
                      install("requests")
                  }
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
          }
          """,

              "app/src/main/AndroidManifest.xml": r"""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="OmniGrab"
                  android:supportsRtl="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """,

              "app/src/main/python/downloader.py": r"""import os
          import re
          import html
          import json
          import requests
          import yt_dlp
          import gallery_dl
          from gallery_dl import config, job

          def run_gallery_dl(url, output_dir, cookie_file, has_cookies):
              config.clear()
              config.set(("extractor",), "base-directory", output_dir)
              config.set(("extractor",), "directory", [])
              if has_cookies:
                  config.set(("extractor",), "cookies", cookie_file)
              dl_job = job.DownloadJob(url)
              return dl_job.run()

          def try_ig_embed_fallback(url, output_dir):
              # Extracts images/videos from public Instagram posts via the embed endpoint without needing login
              m = re.search(r'instagram\.com/(?:p|reel|tv)/([A-Za-z0-9_-]+)', url)
              if not m:
                  return False
              shortcode = m.group(1)
              embed_url = f"https://www.instagram.com/p/{shortcode}/embed/captioned/"
              headers = {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
              }
              r = requests.get(embed_url, headers=headers, timeout=15)
              if r.status_code != 200:
                  return False
              
              # Look for EmbeddedMediaImage high-res src URLs in the embed HTML
              matches = re.findall(r'class="EmbeddedMediaImage"[^>]+src="([^"]+)"', r.text)
              if not matches:
                  matches = re.findall(r'"display_url"\s*:\s*"([^"]+)"', r.text)
              
              saved = 0
              for idx, raw_img_url in enumerate(set(matches)):
                  img_url = html.unescape(raw_img_url.replace("\\u0026", "&").replace("\\/", "/"))
                  img_resp = requests.get(img_url, headers=headers, timeout=15)
                  if img_resp.status_code == 200:
                      out_path = os.path.join(output_dir, f"ig_{shortcode}_{idx+1}.jpg")
                      with open(out_path, "wb") as f:
                          f.write(img_resp.content)
                      saved += 1
              return saved > 0

          def download_media(url, output_dir, cookie_file=None):
              os.makedirs(output_dir, exist_ok=True)
              # Clean tracking query params from Instagram links (?igsh=...)
              clean_url = re.sub(r'\?igsh=[^&]+.*$', '', url.strip())
              has_cookies = bool(cookie_file and os.path.exists(cookie_file) and os.path.getsize(cookie_file) > 60)

              # If it's an Instagram /p/ post, try gallery-dl and embed fallback first before yt-dlp
              if "instagram.com/p/" in clean_url.lower():
                  try:
                      if run_gallery_dl(clean_url, output_dir, cookie_file, has_cookies) == 0:
                          return json.dumps({"status": "success", "engine": "gallery-dl", "message": "Saved to Downloads/OmniGrab"})
                  except Exception:
                      pass
                  try:
                      if try_ig_embed_fallback(clean_url, output_dir):
                          return json.dumps({"status": "success", "engine": "ig-embed", "message": "Saved image to Downloads/OmniGrab"})
                  except Exception:
                      pass

              # 1. Try yt-dlp (Videos, Reels, TikToks, Shorts)
              ydl_opts = {
                  'outtmpl': os.path.join(output_dir, '%(extractor)s_%(id)s.%(ext)s'),
                  'quiet': True,
                  'no_warnings': True,
                  'format': 'best[ext=mp4]/best',
              }
              if has_cookies:
                  ydl_opts['cookiefile'] = cookie_file

              yt_err = ""
              try:
                  with yt_dlp.YoutubeDL(ydl_opts) as ydl:
                      ydl.download([clean_url])
                  return json.dumps({"status": "success", "engine": "yt-dlp", "message": "Saved video to Downloads/OmniGrab"})
              except Exception as e:
                  yt_err = str(e)

              # 2. Fallback to gallery-dl + ig-embed
              try:
                  status = run_gallery_dl(clean_url, output_dir, cookie_file, has_cookies)
                  if status == 0:
                      return json.dumps({"status": "success", "engine": "gallery-dl", "message": "Saved media to Downloads/OmniGrab"})
              except Exception as ge:
                  yt_err += f" | {ge}"

              try:
                  if try_ig_embed_fallback(clean_url, output_dir):
                      return json.dumps({"status": "success", "engine": "ig-embed", "message": "Saved image to Downloads/OmniGrab"})
              except Exception:
                  pass

              if is_auth_error(yt_err) or not has_cookies:
                  return json.dumps({"status": "auth_required", "message": yt_err})
              return json.dumps({"status": "error", "message": yt_err})

          def is_auth_error(msg):
              m = msg.lower()
              triggers = ["login", "sign in", "401", "403", "private", "cookies", "authentication", "rate-limit", "redirect", "no video formats"]
              return any(t in m for t in triggers)
          """,

              "app/src/main/java/com/local/omnigrab/CookieBridge.kt": r"""package com.local.omnigrab

          import android.webkit.CookieManager
          import java.io.File
          import java.net.URI

          object CookieBridge {
              private val trackedDomains = mutableSetOf(
                  "https://www.instagram.com",
                  "https://instagram.com",
                  "https://i.instagram.com",
                  "https://www.tiktok.com",
                  "https://x.com",
                  "https://twitter.com",
                  "https://www.youtube.com",
                  "https://www.reddit.com"
              )

              fun exportToNetscapeFile(targetUrl: String, cookieFile: File): Int {
                  val cookieManager = CookieManager.getInstance()
                  cookieManager.flush()

                  runCatching {
                      val uri = URI(targetUrl)
                      if (uri.scheme != null && uri.host != null) {
                          trackedDomains.add("${uri.scheme}://${uri.host}")
                      }
                  }

                  val sb = StringBuilder("# Netscape HTTP Cookie File\n")
                  val expiry = (System.currentTimeMillis() / 1000) + 31536000L
                  var count = 0

                  for (domainUrl in trackedDomains) {
                      val rawCookies = cookieManager.getCookie(domainUrl) ?: continue
                      val host = URI(domainUrl).host.removePrefix("www.")
                      val pairs = rawCookies.split(";")
                      for (pair in pairs) {
                          val parts = pair.trim().split("=", limit = 2)
                          if (parts.size == 2) {
                              val name = parts[0].trim()
                              val value = parts[1].trim()
                              sb.append(".${host}\tTRUE\t/\tTRUE\t$expiry\t$name\t$value\n")
                              count++
                          }
                      }
                  }
                  cookieFile.writeText(sb.toString())
                  return count
              }
          }
          """,

