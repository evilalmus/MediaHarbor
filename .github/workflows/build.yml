name: Generate and Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Android Project via Python
        run: |
          python3 - << 'EOF'
          import os

          FILES = {
              "settings.gradle.kts": r"""pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
                  maven { url = uri("https://chaquo.com/maven") }
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://chaquo.com/maven") }
              }
          }
          rootProject.name = "OmniGrab"
          include(":app")
          """,

              "build.gradle.kts": r"""plugins {
              id("com.android.application") version "8.3.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
              id("com.chaquo.python") version "15.0.1" apply false
          }
          """,

              "gradle.properties": r"""org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          """,

              "app/build.gradle.kts": r"""plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("com.chaquo.python")
          }

          android {
              namespace = "com.local.omnigrab"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.local.omnigrab"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"

                  ndk {
                      abiFilters += listOf("arm64-v8a", "x86_64")
                  }
              }

              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.10"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          chaquopy {
              defaultConfig {
                  version = "3.11"
                  pip {
                      install("yt-dlp")
                      install("gallery-dl")
                  }
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
          }
          """,

              "app/src/main/AndroidManifest.xml": r"""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="OmniGrab"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """,

              "app/src/main/python/downloader.py": r"""import os
          import json
          import yt_dlp
          import gallery_dl
          from gallery_dl import config, job

          def download_media(url, output_dir, cookie_file=None):
              os.makedirs(output_dir, exist_ok=True)
              
              ydl_opts = {
                  'outtmpl': os.path.join(output_dir, '%(extractor)s_%(id)s.%(ext)s'),
                  'quiet': True,
                  'no_warnings': True,
                  'format': 'best[ext=mp4]/best',
              }
              if cookie_file and os.path.exists(cookie_file) and os.path.getsize(cookie_file) > 0:
                  ydl_opts['cookiefile'] = cookie_file

              try:
                  with yt_dlp.YoutubeDL(ydl_opts) as ydl:
                      ydl.download([url])
                  return json.dumps({"status": "success", "engine": "yt-dlp", "message": "Downloaded video to " + output_dir})
              except Exception as e:
                  err_msg = str(e)
                  if is_auth_error(err_msg):
                      return json.dumps({"status": "auth_required", "message": err_msg})

                  try:
                      config.clear()
                      config.set(("extractor",), "base-directory", output_dir)
                      if cookie_file and os.path.exists(cookie_file) and os.path.getsize(cookie_file) > 0:
                          config.set(("extractor",), "cookies", cookie_file)
                      
                      dl_job = job.DownloadJob(url)
                      status = dl_job.run()
                      if status == 0:
                          return json.dumps({"status": "success", "engine": "gallery-dl", "message": "Downloaded media to " + output_dir})
                      else:
                          return json.dumps({"status": "auth_required", "message": "Gallery extraction failed; login may be required."})
                  except Exception as ge:
                      g_err = str(ge)
                      if is_auth_error(g_err):
                          return json.dumps({"status": "auth_required", "message": g_err})
                      return json.dumps({"status": "error", "message": f"yt-dlp: {err_msg}\ngallery-dl: {g_err}"})

          def is_auth_error(msg):
              m = msg.lower()
              triggers = ["login required", "sign in", "401", "403", "private", "cookies", "authentication", "rate-limit"]
              return any(t in m for t in triggers)
          """,

              "app/src/main/java/com/local/omnigrab/CookieBridge.kt": r"""package com.local.omnigrab

          import android.webkit.CookieManager
          import java.io.File
          import java.net.URI

          object CookieBridge {
              private val trackedDomains = mutableSetOf(
                  "
